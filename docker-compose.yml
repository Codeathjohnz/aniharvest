# AniHarvest on Dokploy (Docker Compose).
# Set these in Dokploy → your Compose app → Environment:
#   DB_PASSWORD, DB_ROOT_PASSWORD, ADMIN_EMAIL, ADMIN_PASSWORD, SEED_SAMPLE_ORDERS
# Then add your domain in Dokploy → Domains → service "app", port 80.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: aniharvest-db   # unique name: other projects on the same Dokploy network may also have a "db"
      DB_NAME: aniharvest_db
      DB_USER: aniharvest
      DB_PASS: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy Environment}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@aniharvest.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in Dokploy Environment}
      SEED_SAMPLE_ORDERS: ${SEED_SAMPLE_ORDERS:-1}
    volumes:
      - uploads:/var/www/html/api/uploads
    depends_on:
      aniharvest-db:
        condition: service_healthy
    expose:
      - "80"

  aniharvest-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: aniharvest_db
      MARIADB_USER: aniharvest
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy Environment}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in Dokploy Environment}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data_v3:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db_data_v3:
  uploads:
