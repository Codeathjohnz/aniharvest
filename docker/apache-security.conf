# Hide server details
ServerTokens Prod
ServerSignature Off

# No directory listings anywhere
<Directory /var/www/html>
    Options -Indexes
</Directory>

# Never serve SQL, backups or dotfiles
<FilesMatch "\.(sql|bak|env|log|sh|md)$|^\.">
    Require all denied
</FilesMatch>

# Uploaded files are images only: never run them as PHP
<Directory /var/www/html/api/uploads>
    php_admin_flag engine off
    <FilesMatch "\.(php|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>

# config.php is included by the API, never requested directly
<Files "config.php">
    Require all denied
</Files>

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
